name: terraform_aws_modules-main

on: 
  push:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      actions:
        description: 'Terraform actions'
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy
      wait_seconds:
        description: 'Wait to review the plan'
        required: false
        default: '0'
permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/TerraformOIDC
          aws-region: eu-central-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -backend-config="bucket=${{ vars.MY_BUCKET }}"

      - name: Terraform Plan
        run: terraform plan 
      
      - name: wait
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.actions != 'plan'
        run: sleep ${{ github.event.inputs.wait_seconds }}
        
      - name: Terraform Apply
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.actions == 'apply'
        run: terraform apply -auto-approve

      - name: Terraform Destroy
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.actions == 'destroy'
        run: terraform destroy -auto-approve
        

